<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Rich aged washi paper tone with organic warm glow -->
    <radialGradient id="paperGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fdfbf5" />
      <stop offset="50%" stop-color="#f7f1e4" />
      <stop offset="80%" stop-color="#efe3d0" />
      <stop offset="100%" stop-color="#dfcfb5" />
    </radialGradient>

    <!-- Edge weathering gradient -->
    <linearGradient id="edgeBurnH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bda788" stop-opacity="0.35" />
      <stop offset="5%" stop-color="#bda788" stop-opacity="0" />
      <stop offset="95%" stop-color="#bda788" stop-opacity="0" />
      <stop offset="100%" stop-color="#bda788" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="edgeBurnV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bda788" stop-opacity="0.35" />
      <stop offset="5%" stop-color="#bda788" stop-opacity="0" />
      <stop offset="95%" stop-color="#bda788" stop-opacity="0" />
      <stop offset="100%" stop-color="#bda788" stop-opacity="0.35" />
    </linearGradient>

    <!-- Subtle paper grain noise filter -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.75  0 0 0 0 0.68  0 0 0 0.08 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" />
      <feBlend mode="multiply" in="SourceGraphic" result="blend" />
    </filter>
  </defs>

  <!-- Main Parchment Paper: Sharp, ragged antique corners with small natural tears and deckled edges -->
  <path
    d="
      M 18,18
      L 24,19 L 45,18 L 85,21 L 120,18 L 155,20
      L 190,18 L 195,24 L 201,18 L 240,21 L 285,18
      L 330,20 L 375,19 L 420,21 L 465,18 L 471,25 L 477,19
      L 520,21 L 565,18 L 610,21 L 650,19 L 678,17
      L 681,24 L 684,20 L 683,55 L 680,95 L 684,140
      L 681,185 L 675,192 L 682,198 L 680,240 L 684,290
      L 681,340 L 683,390 L 680,440 L 674,447 L 682,453
      L 680,500 L 684,550 L 681,600 L 683,650 L 680,695
      L 683,728 L 679,732 L 674,730
      L 650,733 L 610,729 L 570,732 L 530,730 L 485,733
      L 479,726 L 472,732 L 430,730 L 385,733 L 340,730
      L 295,732 L 250,730 L 205,733 L 199,726 L 193,732
      L 150,730 L 110,733 L 70,730 L 35,732 L 19,733
      L 17,726 L 21,722 L 18,685 L 22,640 L 19,595
      L 21,550 L 18,500 L 24,493 L 17,486 L 20,440
      L 18,390 L 21,340 L 19,290 L 21,240 L 17,233 L 23,227
      L 19,185 L 22,140 L 19,95 L 21,55 L 18,25
      Z
    "
    fill="url(#paperGlow)"
    stroke="#bfa685"
    stroke-width="1.2"
    stroke-linejoin="miter"
  />

  <!-- Shading overlay on the ragged perimeter -->
  <path
    d="
      M 18,18
      L 24,19 L 45,18 L 85,21 L 120,18 L 155,20
      L 190,18 L 195,24 L 201,18 L 240,21 L 285,18
      L 330,20 L 375,19 L 420,21 L 465,18 L 471,25 L 477,19
      L 520,21 L 565,18 L 610,21 L 650,19 L 678,17
      L 681,24 L 684,20 L 683,55 L 680,95 L 684,140
      L 681,185 L 675,192 L 682,198 L 680,240 L 684,290
      L 681,340 L 683,390 L 680,440 L 674,447 L 682,453
      L 680,500 L 684,550 L 681,600 L 683,650 L 680,695
      L 683,728 L 679,732 L 674,730
      L 650,733 L 610,729 L 570,732 L 530,730 L 485,733
      L 479,726 L 472,732 L 430,730 L 385,733 L 340,730
      L 295,732 L 250,730 L 205,733 L 199,726 L 193,732
      L 150,730 L 110,733 L 70,730 L 35,732 L 19,733
      L 17,726 L 21,722 L 18,685 L 22,640 L 19,595
      L 21,550 L 18,500 L 24,493 L 17,486 L 20,440
      L 18,390 L 21,340 L 19,290 L 21,240 L 17,233 L 23,227
      L 19,185 L 22,140 L 19,95 L 21,55 L 18,25
      Z
    "
    fill="url(#edgeBurnH)"
    opacity="0.75"
  />

  <path
    d="
      M 18,18
      L 24,19 L 45,18 L 85,21 L 120,18 L 155,20
      L 190,18 L 195,24 L 201,18 L 240,21 L 285,18
      L 330,20 L 375,19 L 420,21 L 465,18 L 471,25 L 477,19
      L 520,21 L 565,18 L 610,21 L 650,19 L 678,17
      L 681,24 L 684,20 L 683,55 L 680,95 L 684,140
      L 681,185 L 675,192 L 682,198 L 680,240 L 684,290
      L 681,340 L 683,390 L 680,440 L 674,447 L 682,453
      L 680,500 L 684,550 L 681,600 L 683,650 L 680,695
      L 683,728 L 679,732 L 674,730
      L 650,733 L 610,729 L 570,732 L 530,730 L 485,733
      L 479,726 L 472,732 L 430,730 L 385,733 L 340,730
      L 295,732 L 250,730 L 205,733 L 199,726 L 193,732
      L 150,730 L 110,733 L 70,730 L 35,732 L 19,733
      L 17,726 L 21,722 L 18,685 L 22,640 L 19,595
      L 21,550 L 18,500 L 24,493 L 17,486 L 20,440
      L 18,390 L 21,340 L 19,290 L 21,240 L 17,233 L 23,227
      L 19,185 L 22,140 L 19,95 L 21,55 L 18,25
      Z
    "
    fill="url(#edgeBurnV)"
    opacity="0.6"
  />

  <!-- Subtle aged stress lines and fiber marks near paper tears -->
  <path d="M 195,24 L 197,32" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 471,25 L 469,33" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 675,192 L 666,194" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 674,447 L 665,448" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 479,726 L 481,718" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 199,726 L 197,718" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 24,493 L 32,495" stroke="#a08564" stroke-width="0.8" opacity="0.45" />
  <path d="M 17,233 L 26,234" stroke="#a08564" stroke-width="0.8" opacity="0.45" />

  <!-- Corner paper creases -->
  <path d="M 25,28 L 38,40" stroke="#b09879" stroke-width="0.7" opacity="0.3" />
  <path d="M 672,28 L 658,42" stroke="#b09879" stroke-width="0.7" opacity="0.3" />
  <path d="M 670,720 L 656,708" stroke="#b09879" stroke-width="0.7" opacity="0.3" />
  <path d="M 28,720 L 42,706" stroke="#b09879" stroke-width="0.7" opacity="0.3" />
</svg>

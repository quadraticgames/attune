<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Paper gradient for rich aged washi parchment tone -->
    <radialGradient id="paperGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#faf5ec" />
      <stop offset="55%" stop-color="#f3ebe0" />
      <stop offset="85%" stop-color="#ede1ce" />
      <stop offset="100%" stop-color="#dfcfb7" />
    </radialGradient>

    <!-- Subtle vignette shadow along the outer deckled perimeter -->
    <linearGradient id="edgeBurnTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbb596" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#cbb596" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="edgeBurnBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cbb596" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#cbb596" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Aged Deckled Parchment Path with organic small tears and rough fiber cuts -->
  <path
    d="
      M 32 36
      C 60 33, 95 38, 130 34
      C 150 32, 165 37, 180 34
      L 186 39 L 192 34
      C 230 36, 275 32, 310 36
      C 345 39, 370 33, 400 35
      L 404 40 L 409 35
      C 450 37, 490 33, 530 36
      C 555 38, 565 44, 568 65
      C 566 95, 571 130, 567 165
      L 562 172 L 568 178
      C 565 215, 570 250, 566 285
      C 564 320, 569 355, 567 390
      L 561 395 L 567 402
      C 570 440, 565 480, 568 515
      C 569 542, 554 564, 530 566
      C 495 563, 460 568, 425 565
      L 418 559 L 412 565
      C 375 563, 340 567, 305 564
      C 270 562, 235 567, 195 564
      L 189 559 L 183 565
      C 145 567, 110 563, 75 566
      C 48 564, 34 548, 33 525
      C 35 490, 31 455, 34 420
      L 39 414 L 33 408
      C 36 370, 31 335, 34 300
      C 32 265, 37 230, 33 195
      L 40 188 L 34 182
      C 31 145, 36 105, 33 70
      C 31 48, 42 37, 32 36
      Z
    "
    fill="url(#paperGrad)"
    stroke="#c3af94"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Subtle inner edge darkening highlight for organic paper thickness -->
  <path
    d="
      M 36 40
      C 140 37, 320 37, 526 40
      C 560 48, 562 180, 562 290
      C 562 400, 560 520, 526 560
      C 380 562, 190 562, 70 560
      C 38 520, 38 400, 38 290
      C 38 180, 38 52, 36 40
      Z
    "
    fill="none"
    stroke="#d8c5ab"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- Faint aged ink edge accents for realism -->
  <path d="M 183 34 L 186 39 L 192 34" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 400 35 L 404 40 L 409 35" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 567 165 L 562 172 L 568 178" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 567 390 L 561 395 L 567 402" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 425 565 L 418 559 L 412 565" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 195 564 L 189 559 L 183 565" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 34 420 L 39 414 L 33 408" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
  <path d="M 33 195 L 40 188 L 34 182" stroke="#9e8467" stroke-width="0.8" fill="none" opacity="0.4" />
</svg>
